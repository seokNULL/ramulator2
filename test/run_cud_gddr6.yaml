Frontend:
  impl: SimpleO3
  clock_ratio: 1
  num_expected_insts: 200000
  llc_capacity_per_core: 2MB
  llc_num_mshr_per_core: 16
  traces:
      # - ./traces/cud_rowcopy/cud_rowcopy_8KB.trace
      # - ./traces/cud_rowcopy/cud_rowcopy_32KB.trace
      # - ./traces/cud_rowcopy/cud_rowcopy_128KB.trace
      # - ./traces/cud_rowcopy/cud_rowcopy_512KB.trace
      # - ./traces/cud_rowcopy/cud_rowcopy_2MB.trace
      # - ./traces/cud_rowcopy/cud_rowcopy_8MB.trace
      #  - ./traces/cud_add/cud_add_4bit.trace
      - ./traces/cud_mul/cud_mul_4bit.trace
      # - ./traces/cud_extra/cud_maj3.trace

  CuDSchedulingPolicy : CuDPriority
  # Note: RoundRobinRank/RoundRobinBankGroup use hardcoded addr_vec indices that
  # assume a rank level. GDDR6 has no rank (ch->bg->bank->row->col), so only
  # CuDPriority is safe. RoundRobinBank also uses kIdxRank=1 so avoid it too.

  Translation:
    impl: NoTranslation
    max_addr: 2147483648

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: GDDR6
    org:
      preset: GDDR6_8Gb_x16
    timing:
      preset: GDDR6_2000_1350mV_double
    # Note: GDDR6 does not define voltage/current presets; power stats are disabled.

  Controller:
    impl: CuD
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    # ChRaBaRoCo: sequential ch->bg->bank->row->col mapping, compatible with
    # GDDR6's rank-free hierarchy.
    impl: ChRaBaRoCo
